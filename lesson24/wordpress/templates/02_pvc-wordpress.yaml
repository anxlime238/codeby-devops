apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-wordpress-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Release.Name }}-{{ .Values.storageClass.name }}
  selector:
    matchLabels:
      app: {{ include "wordpress.wordpressName" . }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage.size }}
