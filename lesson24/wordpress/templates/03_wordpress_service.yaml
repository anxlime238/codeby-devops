apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress.wordpressName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "wordpress.wordpressName" . }}
  ports:
    - port: {{ .Values.wordpress.port }}
      targetPort: {{ .Values.wordpress.port }}
