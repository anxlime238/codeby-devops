apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "wordpress.mysqlName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ include "wordpress.mysqlName" . }}
  replicas: {{ .Values.mysql.replicas }}
  selector:
    matchLabels:
      app: {{ include "wordpress.mysqlName" . }}
  template:
    metadata:
      labels:
        app: {{ include "wordpress.mysqlName" . }}
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | quote }}
          ports:
            - containerPort: {{ .Values.mysql.port }}
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: {{ .Values.mysql.storage.mountPath | quote }}
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mysql-pvc

