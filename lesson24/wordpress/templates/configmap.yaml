apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
  WORDPRESS_DB_HOST: {{ printf "%s:%v" (include "wordpress.mysqlName" .) .Values.mysql.port | quote }}
  WORDPRESS_DB_NAME: {{ .Values.mysql.database | quote }}
  WORDPRESS_DB_USER: {{ .Values.mysql.user | quote }}
